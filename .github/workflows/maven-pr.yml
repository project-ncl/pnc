name: Java CI with Maven

permissions:
  contents: read

on:
  pull_request:
    branches: ["*"]

jobs:
  call-maven-ci:
    uses: project-ncl/shared-github-actions/.github/workflows/maven-ci.yml@a27e6fba6b28bbb96881ec096e9c8ea5a538f481 # v0.0.22
    with:
      java_version: 11
      build_command: "mvn clean install -DskipTests"
      upload_artifacts: true

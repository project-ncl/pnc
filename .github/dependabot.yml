# To get started with Dependabot version updates, you'll need to specify which
# package ecosystems to update and where the package manifests are located.
# Please see the documentation for all configuration options:
# https://docs.github.com/github/administering-a-repository/configuration-options-for-dependency-updates
version: 2
updates:
  - package-ecosystem: "maven" # See documentation for possible values
    directory: "/" # Location of package manifests
    schedule:
      interval: "weekly"
    # wait after a new release till we create a PR, to reduce risk of pulling
    # a compromised new version
    cooldown:
      default-days: 7
      # Exclude our own repos from cooldown
      # https://docs.github.com/en/code-security/reference/supply-chain-security/dependabot-options-reference#cooldown-
      exclude:
        - "org.jboss.da:*"
        - "org.jboss.pnc*:*"        # match org.jboss.pnc:xyz and org.jboss.pnc.group:xyz
    ignore:
      # spotless-maven-plugin 3.x requires JDK 17+ to run; CI still runs on JDK 11.
      # The safe ceiling is 2.x (latest: 2.46.1).
      # Remove this exclusion when the CI baseline is raised to JDK 17.
      - dependency-name: "com.diffplug.spotless:spotless-maven-plugin"
        versions: ["3.x"]
      # testcontainers-keycloak 3.x switched from keycloak-admin-client-jee (javax.ws.rs)
      # to the standard keycloak-admin-client (jakarta.ws.rs), which is binary-incompatible
      # with EAP 7.4's RESTEasy 3.x / javax.* stack.
      # testcontainers-keycloak 4.x additionally requires testcontainers core 2.x,
      # which conflicts with the project's pinned 1.x version.
      # The safe ceiling is 2.x (latest: 2.6.0, which uses keycloak-admin-client-jee).
      # Remove these exclusions when the project migrates to EAP 8 / Jakarta EE 10.
      - dependency-name: "com.github.dasniko:testcontainers-keycloak"
        versions: ["3.x", "4.x"]
      # json-schema-validator 3.x requires JDK 17+ and Jackson 3.x; CI is on JDK 11
      # and the project uses Jackson 2.x. The SchemaRegistry/SchemaRegistryConfig API
      # used in SlsaProvenanceUtils was also restructured in 3.x (binary-incompatible).
      # Remove this exclusion when the CI baseline is raised to JDK 17 and Jackson is
      # upgraded to 3.x.
      - dependency-name: "com.networknt:json-schema-validator"
        versions: ["3.x"]
      # Netty 4.2.x is a breaking major upgrade that cannot be applied here:
      # 1. PNC runs inside JBoss EAP 7.4, whose module system provides Netty 4.1;
      #    mixing 4.1 (container) and 4.2 (app) on the classpath causes LinkageError.
      # 2. Vert.x 3.9.14 (version.vertx-core) was built against Netty 4.1 and is
      #    incompatible with 4.2 (netty-codec jar was split; NioEventLoopGroup
      #    semantics changed).
      # 3. TLS hostname verification is now ON by default in 4.2, which would break
      #    internal HTTPS calls that rely on the 4.1 opt-in behaviour.
      # Remove these exclusions when EAP and Vert.x are both upgraded to versions
      # that ship Netty 4.2.
      - dependency-name: "io.netty:netty-bom"
        versions: ["4.2.x"]
      - dependency-name: "io.netty:netty-handler"
        versions: ["4.2.x"]
      # rest-assured 6.0.0+ requires JDK 17 minimum; CI still runs on JDK 11.
      # Remove this exclusion when the CI baseline is raised to JDK 17.
      - dependency-name: "io.rest-assured:rest-assured"
        versions: ["6.x"]
      # smallrye-config 4.x is binary-incompatible with resteasy-client-microprofile 3.15.x;
      # SmallRyeConfigProviderResolver#getConfig() changed return type, causing AbstractMethodError.
      # Remove this exclusion when resteasy-client-microprofile is upgraded to a 4.x-compatible version.
      - dependency-name: "io.smallrye.config:smallrye-config"
        versions: ["4.x", "5.x"]
      # vertx-core 5.x removed the callback-style API and requires Netty 4.2.x (5.2.2 -> 4.2.19),
      # which is also ignored above (EAP 7.4 ships Netty 4.1). VertxWebSocketClient in rest-client
      # uses HttpClient#webSocket(.., Handler), WebSocket#close(Handler) and Vertx#close(Handler),
      # which no longer exist, so compilation fails. The safe ceiling is 4.x: 4.5.x still has the
      # callback API, compiles and passes rest-client tests unchanged, and uses Netty 4.1.x.
      # Remove this exclusion when VertxWebSocketClient is migrated to the Future-based API
      # and Netty 4.2.x is allowed.
      - dependency-name: "io.vertx:vertx-core"
        versions: ["5.x"]
      # kafka-clients 4.x is a major version upgrade incompatible with apicurio-registry-utils-kafka 1.3.2.Final,
      # which was built against Kafka 2.x/3.x. Kafka 4.x also drops support for older broker versions and message
      # formats. kafka-clients is managed solely as a transitive CVE override for Apicurio.
      # Remove this exclusion when apicurio-registry-utils-kafka is upgraded or replaced.
      - dependency-name: "org.apache.kafka:kafka-clients"
        update-types: ["version-update:semver-major"]
      # dbunit 3.x overhauled the JUnit 4 base-class API (DBTestCase / DatabaseTestCase)
      # and changed FlatXmlProducer / IDatabaseConnection semantics in ways that break
      # the existing Arquillian/JUnit 4 integration tests in the model module.
      # Remove this exclusion when surefire and junit-platform are both
      # upgraded to mutually compatible versions.
      - dependency-name: "org.dbunit:dbunit"
        update-types: ["version-update:semver-minor", "version-update:semver-patch"]
      # maven-surefire-plugin 3.6.x+ requires junit-platform-commons >=1.11.0 (ClassFilter
      # moved packages in that release), but dbunit 3.0.0 forces junit-platform-commons:1.10.3
      # onto the classpath via junit-platform-suite-engine, causing the junit-vintage engine
      # to fail test discovery with "TestEngine with ID 'junit-vintage' failed to discover tests".
      # Remove this exclusion when dbunit is upgraded past 3.0.0.
      - dependency-name: "org.apache.maven.plugins:maven-surefire-plugin"
        update-types: ["version-update:semver-minor"]
      # jboss-eap-jakartaee8 BOM is locked to 7.4.7.GA to match the targeted JBoss EAP 7.4
      # runtime and provisioned test container (EAP XP 4.0.0 / 7.4.7). Upgrades to newer
      # micro/patch versions (7.4.11.GA - 7.4.25.GA+) cause alignment and compatibility
      # issues with the runtime environment.
      # Remove this exclusion when the runtime EAP container is upgraded to a newer release.
      - dependency-name: "org.jboss.bom:jboss-eap-jakartaee8"
  - package-ecosystem: "github-actions" # Also update Github actions
    directory: "/"
    schedule:
      # Check for updates to GitHub Actions every week
      interval: "weekly"
    # wait after a new release till we create a PR, to reduce risk of pulling
    # a compromised new version
    cooldown:
      default-days: 7
